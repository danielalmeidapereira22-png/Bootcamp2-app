<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Clima</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🌤️ Painel do Clima</h1>
    
    <div class="busca-box">
      <input type="text" id="campo-busca" placeholder="Digite uma cidade (ex: São Paulo)">
      <button id="botao-buscar">Buscar</button>
    </div>

    <div id="resultado" class="card-resultado">
      <p>Digite o nome de uma cidade para ver a previsão.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
